[package]
name = "octosense-appcard"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4", features = ["appcard", "maps"] }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "d4502ef1e4d196d2829a07aa137740cb0581e9b4" }
# The whole Octoscript-AppCard app as a library: routing brain, card store and
# transport, L0 lowering, sessions, composer, kernel agent — mounted here as
# its `AppShell` widget. No default features: the app's own entry points
# (`app_main!`, the dev monitor) stay out; this module is the entry point.
octos-app = { git = "https://github.com/OctoSense-org/Octoscript-AppCard.git", rev = "3a793964f4c7c8b87e9f43d595174c98b1815987", default-features = false }
# Tool arguments (`ask` takes `{"text": ...}`).
serde_json = "1.0"
